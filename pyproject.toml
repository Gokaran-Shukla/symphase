[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "symphase"
version = "1.0.0"
description = "Magnetic symmetry, symmetry-allowed charge/spin/orbital conductivity tensors and convex-hull phase stability for VASP calculations"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Gokaran Shukla"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.7", "spglib>=2.0", "pymatgen>=2023.1", "matplotlib>=3.5"]
keywords = ["VASP", "magnetic space group", "spin Hall", "orbital Hall", "convex hull", "phase stability", "DFT"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Physics",
               "License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
mp = ["mp-api"]
mpi = ["mpi4py"]
notebooks = ["jupyter", "ipywidgets"]
ssg = ["findspingroup>=0.16"]        # OSSG numbers of Chen et al. (2024), Python >= 3.11
phonons = ["phonopy>=2.20"]         # phonopy force constants (magnon–phonon) and QHA cross-checks
mxene = ["chgnet>=0.3", "ase>=3.23"]  # MXene / 2D module: universal-potential relaxations and hulls
full = ["mp-api", "findspingroup>=0.16", "phonopy>=2.20", "jupyter", "ipywidgets", "chgnet>=0.3", "ase>=3.23"]
dev = ["pytest"]

[project.scripts]
symphase = "symphase.cli:main"

[project.urls]
Homepage = "https://github.com/Gokaran-Shukla/symphase"

[tool.setuptools.packages.find]
include = ["symphase*"]

[tool.setuptools.package-data]
symphase = ["data/*.txt", "data/*.json"]
